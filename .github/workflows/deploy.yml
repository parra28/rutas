name: Publicar Rutómetro

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Si se empujan varios cambios seguidos, solo se publica el ultimo.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construir:
    name: Procesar los GPX y generar el sitio
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generar el sitio
        run: node src/build.mjs

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  desplegar:
    name: Publicar en GitHub Pages
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4
